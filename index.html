<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MacacoShop - Sua Loja de Eletrônicos e Utilidades</title>
    <link rel="stylesheet" href="index.css">
</head>
<body>

    <header class="header-loja">
        <div class="logo">
            <h1>MacacoShop</h1>
        </div>
    </header>

    <section class="hero-banner">
        <h2>As melhores ofertas estão aqui!</h2>
        <p>Encontre de tudo por um preço acessível!</p>
    </section>

    <section class="search_holder">
        <form onsubmit="return false;">
            <label for="filt_form">O que você está procurando?</label>
            <input
                class="filt"
                id="filt_form" 
                type="text" 
                placeholder="Pesquisar"
                name="filterer"
            >
        </form>
    </section>

    <main>
        <section id="campo_superior"></section>
    </main>

    <footer class="footer-loja">
        <p>&copy; MacacoShop - 2026.</p>
    </footer>

        const Div_main = document.getElementById('campo_superior');

        const produtos = [

                'Geladeira Electrolux', 
                'Geladeira alta performance Electrolux, Bivolt, gela até o rego.', 
                'Eletrodomésticos', 
                'R$ 2639'
            ],
            [
                'https://assets.tramontina.com.br/upload/tramon/imagens/CUT/20297612PDM001G.jpg', 
                'Kit Cozinha - Tramontina 47 Itens', 
                'Contém Panelas Anti-aderente Tramontina, kit facas, kit utensílios, kit talheres, kit tupperware', 
                'Utensílios de Cozinha', 
                'R$ 400'

            [
                'https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcTZ7Vz9zE8bnwH4LTyOqk-YR-1JSUVv2Gf7OWFf6ZSc3Q&s',

                'Relógio Digital', 
                'Relógio Digital Preto Masculino', 
                'Eletrônicos', 
                'R$ 86'
            ],

        ];

        function renderizarProdutos(lista) {
            Div_main.innerHTML = ''; 
            
            lista.forEach((produto) => {
                const create_Div = document.createElement('section');
                create_Div.setAttribute('class', 'card');
                Div_main.append(create_Div);

                produto.forEach((argument, index) => {
                    if (index === 0) {
                        const create_Img = document.createElement('img');
                        create_Img.src = argument;
                        create_Img.alt = produto[1];
                        create_Div.append(create_Img);
                    } else {
                        const create_Text = document.createElement('p');
                        create_Text.textContent = argument;
                        create_Div.append(create_Text);
                    }
                });   
            });
        }
        
        renderizarProdutos(produtos);

        form.addEventListener('input', function() {
            const searchValue = form.value.toLowerCase().trim();

            const produtosFiltrados = produtos.filter(produto => {
                const produtoTexto = produto.join(' ').toLowerCase();
                return produtoTexto.includes(searchValue);
            });

            renderizarProdutos(produtosFiltrados);
        });
    </script>
</body>
</html>
